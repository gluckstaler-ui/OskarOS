<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OskarOS · CRM · Kanban</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0a0907; overflow: hidden; }
    body { font-family: 'Inter', system-ui, sans-serif; }
    #root { position: fixed; inset: 0; }

    .explorations-link {
      position: fixed;
      bottom: 14px; right: 18px;
      font: 500 10px/1 'JetBrains Mono', monospace;
      letter-spacing: 1.4px;
      color: #7a6f5a;
      text-decoration: none;
      padding: 6px 10px;
      border: 1px solid #2a2519;
      background: rgba(20, 16, 10, 0.7);
      backdrop-filter: blur(6px);
      z-index: 100;
      transition: color 0.15s, border-color 0.15s;
    }
    .explorations-link:hover { color: #ffb84a; border-color: #7a6536; }
  </style>
</head>
<body>

  <template id="__bundler_thumbnail" data-bg-color="#0a0907">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <!-- 4 kanban columns silhouette in amber/phosphor -->
      <rect x="60"  y="180" width="240" height="540" fill="#171410" stroke="#2a2519" />
      <rect x="320" y="180" width="240" height="540" fill="#171410" stroke="#2a2519" />
      <rect x="580" y="180" width="240" height="540" fill="#171410" stroke="#2a2519" />
      <rect x="840" y="180" width="240" height="540" fill="#171410" stroke="#2a2519" />
      <!-- column accent rails -->
      <rect x="60"  y="178" width="240" height="3" fill="#88d4dc" />
      <rect x="320" y="178" width="240" height="3" fill="#7a6536" />
      <rect x="580" y="178" width="240" height="3" fill="#ffb84a" />
      <rect x="840" y="178" width="240" height="3" fill="#c8ee7a" />
      <!-- cards as horizontal strokes -->
      <g fill="#1c1a13" stroke="#2a2519">
        <rect x="78"  y="220" width="204" height="46" />
        <rect x="78"  y="276" width="204" height="46" />
        <rect x="78"  y="332" width="204" height="46" />
        <rect x="338" y="220" width="204" height="46" />
        <rect x="338" y="276" width="204" height="46" />
        <rect x="598" y="220" width="204" height="46" />
        <rect x="598" y="276" width="204" height="46" />
        <rect x="858" y="220" width="204" height="46" />
        <rect x="858" y="276" width="204" height="46" />
        <rect x="858" y="332" width="204" height="46" />
      </g>
      <!-- amber title bar -->
      <text x="60" y="120" font-family="JetBrains Mono, monospace" font-size="34" font-weight="500" letter-spacing="3" fill="#ffb84a">OSKAROS · KANBAN</text>
      <text x="60" y="155" font-family="Inter, sans-serif" font-size="14" fill="#7a6f5a" letter-spacing="1.4">CRM · TERRITORY × FATHOM</text>
    </svg>
  </template>

  <div id="root" data-screen-label="Kanban"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="crm-data.js"></script>
  <script type="text/babel" src="kanban.jsx"></script>

  <script type="text/babel">
    ReactDOM.createRoot(document.getElementById('root')).render(<Kanban />);
  </script>
</body>
</html>
