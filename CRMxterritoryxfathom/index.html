<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OskarOS · CRM · Overview</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0a0907; overflow: hidden; }
    body { font-family: 'Inter', system-ui, sans-serif; }
    #root { position: fixed; inset: 0; }

    /* Subtle link to the explorations page — bottom-right floating */
    .explorations-link {
      position: fixed;
      bottom: 14px; right: 18px;
      font: 500 10px/1 'JetBrains Mono', monospace;
      letter-spacing: 1.4px;
      color: #7a6f5a;
      text-decoration: none;
      padding: 6px 10px;
      border: 1px solid #2a2519;
      background: rgba(20, 16, 10, 0.7);
      backdrop-filter: blur(6px);
      z-index: 100;
      transition: color 0.15s, border-color 0.15s;
    }
    .explorations-link:hover { color: #ffb84a; border-color: #7a6536; }
  </style>
</head>
<body>

  <div id="root" data-screen-label="Overview"></div>

  <!-- Explorations link hidden in production build (debug flag) -->

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Data + component -->
  <script src="crm-data.js"></script>
  <script type="text/babel" src="variations/v3-minimal.jsx"></script>

  <!-- Mount C full-viewport -->
  <script type="text/babel">
    ReactDOM.createRoot(document.getElementById('root')).render(<V3Focus />);
  </script>
</body>
</html>
