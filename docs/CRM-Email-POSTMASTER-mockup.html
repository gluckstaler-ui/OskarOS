body{font-family:var(--font-sans);-webkit-font-smoothing:antialiased}

.isl-snip{font-size:12px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.chat{background:var(--bg-card);border:1px solid var(--border-card);border-radius:var(--radius-card);padding:13px;display:flex;flex-direction:column;min-height:260px}

.chat-scroll{flex:1;overflow-y:auto}

.chat-in{margin-top:10px;display:flex;gap:8px}
.chat-in input{flex:1;background:var(--bg-sunken);border:1px solid var(--border-card);border-radius:8px;color:var(--text-main);font:inherit;font-size:12px;padding:8px 10px}
</style>

/* ═══ send / discard — the loop, no modal ═══ */
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function send(a,ch,fromCard){const ta=$(fromCard?'rb-card-'+a:'rb-'+a+':'+ch);const text=ta?ta.value.trim():'';if(!text)return;
 const sug=fromCard?(CARD_PREFILL[a]||''):(SUGGEST[a+':'+ch]||'');const edited=sug&&text!==sug.trim();
 const line=esc(text.split('\n')[0]);
 const attKey=fromCard?'card-'+a:a+':'+ch;const atts=PENDING_ATT[attKey]||[];delete PENDING_ATT[attKey];
 MSG.unshift({a,ch,dir:'out',id:'filippo → '+(ch==='em'?A[a].emails[0]:A[a].phones[0]),t:'10:02',ts:1002,b:line.slice(0,90)+(line.length>90?'…':''),att:atts.length?atts:undefined,fresh:true});
 HIST[a].unshift(['10:02',CH[ch].g,`<b>${CH[ch].n} out</b> — ${line.slice(0,70)}…${edited?' · <i>draft edited</i>':''}${atts.length?` · 📎 ${atts.map(x=>x.split(' ·')[0]).join(', ')}`:''}`,1]);
 CHAT.push({w:'sys',b:`→ SENT · ${CH[ch].n.toLowerCase()} · <b>${A[a].co}</b> — ${line.slice(0,60)}…${atts.length?` · 📎 ${atts.length} file${atts.length>1?'s':''}`:''}`});
 if(edited)CHAT.push({w:'consular',b:'Read the diff — you cut the phone option and made the close human. Noted; never re-offered.'});
 if(fromCard){delete SUGGEST[a+':em'];delete SUGGEST[a+':wa'];CARD_PREFILL[a]=''}else delete SUGGEST[a+':'+ch];
 deck=deck.filter(c=>c.a!==a||!c.line.includes('prefilled'));S.corpus++;
 renderRail();renderHero();renderRight();renderList();if(fromCard)openCard(a)}

/* ═══ consular chat (simulated agent, real interaction) ═══ */
const CARD_PREFILL={};
function askConsular(){const q=($('chat-q')?.value||'').trim();if(!q)return;
 const e=q.replace(/&/g,'&amp;').replace(/</g,'&lt;');
 CHAT.push({w:'fil',b:e});
 const lo=q.toLowerCase();let r;
 if(lo.includes('kanzlei'))r='Meier wants it; the CFO doesn\'t yet. The nudge names Friday as the deadline — <b>it\'s prefilled on the card.</b> Don\'t discount.';
 else if(lo.includes('meridiana'))r='12 days of silence after warmth is season-prep, not a no. <b>Call, don\'t write</b> — it\'s on the deck.';
 else if(lo.includes('bistrot')||lo.includes('chiara'))r='She asked to sign. Close this week — bring the papers Thursday, answer the photo question. Marco\'s terrace shots are in <b>media/bistrot-olmo/</b>.';
 else if(lo.includes('attachment')||lo.includes('media'))r='Every client file from email or WhatsApp lands in <b>media/&lt;account&gt;/</b> — the Attachments bento lists clients by latest incoming.';
 else r='I hold the whole book — ask me about a lead, a thread, or what to send next. The prefills are on the cards.';
 CHAT.push({w:'consular',b:r});renderRight()}
