<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OskarOS CRM · Overview + Email (v6, drawn from the prototype)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root[data-theme="onyx"]{--bg:#0a0907;--bar:#13110d;--line:#2a2519;--amber:#ffb84a;--amberDim:#7a6536;--bone:#ece1c5;--muted:#7a6f5a;--exec:#0a0805}
:root[data-theme="polar"]{--bg:#ffffff;--bar:#f7f2e2;--line:#806a3a;--amber:#e89e16;--amberDim:#8a5a18;--bone:#1a1408;--muted:#453620;--exec:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);height:100vh;overflow:hidden;display:flex;flex-direction:column;font-family:'Inter',system-ui,sans-serif}
.bar{flex:none;display:flex;align-items:center;gap:22px;height:48px;padding:0 18px;background:var(--bar);border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:13px;color:var(--bone);display:flex;align-items:baseline;gap:7px}
.brand .c{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--amber)}
.tabs{display:flex;gap:5px}
.tab{border:1px solid transparent;background:none;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);padding:6px 13px;cursor:pointer}
.tab:hover{color:var(--bone)}
.tab.on{color:var(--amber);border-color:var(--amber);font-weight:700}
.themer{margin-left:auto;display:flex;border:1px solid var(--line)}
.themer button{border:none;background:none;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);padding:7px 12px;cursor:pointer}
.themer button.on{background:var(--amber);color:var(--exec);font-weight:700}
.stage{flex:1;min-height:0;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.hidden{display:none}
</style>
</head>
<body>
<div class="bar">
  <div class="brand">OskarOS<span class="c">CRM</span></div>
  <div class="tabs" id="tabs">
    <button class="tab" data-scr="overview">Overview</button>
    <button class="tab on" data-scr="email">Email</button>
  </div>
  <div class="themer" id="themer">
    <button data-t="onyx" class="on">Onyx</button>
    <button data-t="polar">Polar</button>
  </div>
</div>
<div class="stage">
  <iframe id="frame" title="screen"></iframe>
</div>
<script>
const state={scr:'email',theme:'onyx'};
const SRC={
  // Overview = MY reproduction showing the email-in-overview interaction
  // (no longer the cheated live-app iframe). Both views share this shell's header.
  overview:{onyx:'crm-overview-screen.html?theme=onyx',polar:'crm-overview-screen.html?theme=polar'},
  email:{onyx:'crm-email-screen.html?theme=onyx',polar:'crm-email-screen.html?theme=polar'},
};
function paint(){
  document.documentElement.setAttribute('data-theme',state.theme);
  document.querySelectorAll('#tabs .tab').forEach(b=>b.classList.toggle('on',b.dataset.scr===state.scr));
  document.querySelectorAll('#themer button').forEach(b=>b.classList.toggle('on',b.dataset.t===state.theme));
  document.getElementById('frame').src=SRC[state.scr][state.theme];
}
document.addEventListener('click',e=>{
  const t=e.target.closest('#tabs .tab');if(t){state.scr=t.dataset.scr;paint();return;}
  const th=e.target.closest('#themer button');if(th){state.theme=th.dataset.t;paint();return;}
});
paint();
</script>
</body>
</html>
